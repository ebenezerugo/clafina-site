name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Production: Actions → Deploy → Run workflow, on main. Waits for approval on the production environment.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    # Previews only for branches of this repository (never forks), built here from the exact commit CI checked,
    # the same way production is built. No copy of the site is stored between workflows, so artifact storage
    # can never block a preview.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$HEAD_BRANCH" = "main" ]; then echo "Refusing to publish a preview to main"; exit 1; fi
          SAFE=$(printf '%s' "$HEAD_BRANCH" | tr -c 'A-Za-z0-9-' '-' | cut -c1-28)
          echo "PREVIEW_BRANCH=preview-$SAFE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy the preview
        run: npx --yes wrangler@4.157.0 pages deploy out --project-name clafina-site --branch "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  staging:
    # Every merge to main goes to staging: the latest whole site for the team, kept out of search engines.
    # The clafina-site Cloudflare project is staging as a whole, so this publishes to its main address
    # (clafina-site.pages.dev, and staging.clafina.com bound to it) and to the staging alias. Production
    # lives in its own project (see the production job), so staging can never overwrite it.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CLAFINA_APP_URL: ${{ vars.CLAFINA_APP_URL }}
          CLAFINA_SIGNUP_URL: ${{ vars.CLAFINA_SIGNUP_URL }}
      - name: Keep staging out of search engines
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> out/_headers
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
      - name: Deploy to staging
        run: |
          npx --yes wrangler@4.157.0 pages deploy out --project-name clafina-site --branch main
          npx --yes wrangler@4.157.0 pages deploy out --project-name clafina-site --branch staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    # Released by hand only (Run workflow on main), after approval on the "production" environment, and only
    # once CLAFINA_PRODUCTION_ENABLED is "true". The production build refuses anything not ready for launch.
    # It publishes to its own Cloudflare project (CLAFINA_PRODUCTION_PROJECT, default "clafina"), never to
    # clafina-site, which is staging.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.CLAFINA_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:production
        env:
          CLAFINA_APP_URL: ${{ vars.CLAFINA_APP_URL }}
          CLAFINA_SIGNUP_URL: ${{ vars.CLAFINA_SIGNUP_URL }}
      - name: Deploy to production
        run: |
          if [ "$PRODUCTION_PROJECT" = "clafina-site" ]; then echo "clafina-site is staging; production needs its own project"; exit 1; fi
          # Creates the project on the first release; afterwards it already exists.
          npx --yes wrangler@4.157.0 pages project create "$PRODUCTION_PROJECT" --production-branch main || true
          npx --yes wrangler@4.157.0 pages deploy out --project-name "$PRODUCTION_PROJECT" --branch main
        env:
          PRODUCTION_PROJECT: ${{ vars.CLAFINA_PRODUCTION_PROJECT || 'clafina' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
