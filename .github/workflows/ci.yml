name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:css
      - run: npm run check:content
      - run: npm run build
      - run: npm run check:output
      - run: npm run check:links
      - run: npx playwright test
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: site
          # The Pages Functions import shared code from src/ and use zod, so the deploy can build them.
          path: |
            out/
            functions/
            src/
            package.json
            node_modules/zod/
