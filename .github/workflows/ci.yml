name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The gate compares the baseline with where the branch left main: it needs history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security gate
        run: bash scripts/check-security.sh --full
      - run: npm run rebuild:native
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:css
      - run: npm run check:content
      - run: npm run build
      - run: npm run check:output
      - run: npm run check:links
      - run: npx playwright test
      - run: npx lhci autorun
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Reports are kept only when something failed, and only for a few days: artifact storage is limited.
        if: failure()
        with:
          name: reports
          retention-days: 3
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
